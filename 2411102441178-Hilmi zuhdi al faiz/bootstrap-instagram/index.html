<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil Instagram — Bootstrap (Posts)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-dark">

  <!-- Header: mobile center, sm+ left (2 kolom) -->
  <header class="container py-4 border-bottom">
    <div class="row g-4 align-items-center text-center text-sm-start">
      <div class="col-12 col-sm-auto d-flex justify-content-center justify-content-sm-start">
        <img src="assets/img/pp.jpg"
             alt="Foto Profil" class="rounded-circle border"
             style="width:136px;height:136px;object-fit:cover">
      </div>
      <div class="col-12 col-sm">
        <div class="d-flex flex-wrap align-items-center gap-2 justify-content-center justify-content-sm-start">
          <h1 class="h3 mb-0">alvacelaa</h1>
          <span class="btn btn-outline-secondary btn-sm">Edit Profile</span>
          <span class="btn btn-outline-secondary btn-sm">Archive</span>
        </div>
        <ul class="list-inline my-2 small m-0 d-flex justify-content-center justify-content-sm-start gap-3">
          <li class="list-inline-item"><b>12</b> posts</li>
          <li class="list-inline-item"><b>900.k</b> followers</li>
          <li class="list-inline-item"><b>2</b> following</li>
        </ul>
        <div class="small">
          <p class="fw-semibold mb-0">ael</p>
          <p class="mb-1">main • mangan • turu</p>
          <a href="#" class="link-primary">jessnolimit</a>
        </div>
        <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-sm-start py-3">
          <!-- highlights -->
          <div class="text-center">
            <div class="rounded-circle border d-grid" style="place-items:center;width:76px;height:76px;background:#fff;">
              <img src="assets/img/12.jpeg" class="rounded-circle" style="width:68px;height:68px;object-fit:cover" alt="H1">
            </div>
            <div class="text-muted small">H1</div>
          </div>
          <div class="text-center">
            <div class="rounded-circle border d-grid" style="place-items:center;width:76px;height:76px;background:#fff;">
              <img src="assets/img/11.jpeg" class="rounded-circle" style="width:68px;height:68px;object-fit:cover" alt="H2">
            </div>
            <div class="text-muted small">H2</div>
          </div>
          <div class="text-center">
            <div class="rounded-circle border d-grid" style="place-items:center;width:76px;height:76px;background:#fff;">
              <img src="assets/img/8.jpeg" class="rounded-circle" style="width:68px;height:68px;object-fit:cover" alt="H3">
            </div>
            <div class="text-muted small">H3</div>
          </div>
          <div class="text-center">
            <div class="rounded-circle border d-grid" style="place-items:center;width:76px;height:76px;background:#fff;">
              <img src="assets/img/10.jpeg" class="rounded-circle" style="width:68px;height:68px;object-fit:cover" alt="H4">
            </div>
            <div class="text-muted small">H4</div>
          </div>
          <div class="text-center">
            <div class="rounded-circle border d-grid" style="place-items:center;width:76px;height:76px;background:#fff;">
              <img src="assets/img/9.jpeg" class="rounded-circle" style="width:68px;height:68px;object-fit:cover" alt="H5">
            </div>
            <div class="text-muted small">H5</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- “Tabs” sederhana: pindah halaman -->
  <nav class="border-bottom">
    <div class="container d-flex justify-content-center gap-4 text-uppercase small fw-semibold py-3">
      <a href="#"  class="text-decoration-none text-reset">Posts</a>
      <a href="#"  class="text-decoration-none text-reset">Reels</a>
      <a href="#" class="text-decoration-none text-reset">Tagged</a>
    </div>
  </nav>

  <!-- Grid Posts: col-12 -> col-sm-6 -> col-lg-4 -->
  <main class="container my-2">
    <div class="row g-1">
      <!-- duplikasikan 12x dengan seed berbeda -->
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/1.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/2.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/3.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/4.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/5.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/6.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/7.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/8.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/9.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/10.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/11.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="ratio ratio-1x1"><img src="assets/img/12.jpeg" class="w-100 h-100 object-fit-cover" alt=""></div></div>
    </div>
  </main>

  <footer class="container text-center text-muted small py-5">&copy; Hilmi Jago 2025</footer>
</body>
</html>
